name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Dependencies
        run: npm install

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" build-output/MrEpicStreamBuddy.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrEpicStreamBuddy.apk
          path: build-output/MrEpicStreamBuddy.apk
          if-no-files-found: error
