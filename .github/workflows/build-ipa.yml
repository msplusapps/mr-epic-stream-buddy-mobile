name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Compile Native iOS Application (Unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace MrEpicStreamBuddy.xcworkspace \
            -scheme MrEpicStreamBuddy \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/MrEpicStreamBuddy.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO

      - name: Package into IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -r build/MrEpicStreamBuddy.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r MrEpicStreamBuddy.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrEpicStreamBuddy.ipa
          path: ios/build/MrEpicStreamBuddy.ipa
          if-no-files-found: error
